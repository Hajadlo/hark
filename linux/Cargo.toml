[package]
name = "hark"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
cpal = "0.16"
hound = "3.5"
evdev = "0.13"
wl-clipboard-rs = "0.9"
rustix = { version = "1", features = ["event", "fs", "stdio"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
tiny-skia = "0.11"
fontdue = "0.9"

[dev-dependencies]
tempfile = "3"
